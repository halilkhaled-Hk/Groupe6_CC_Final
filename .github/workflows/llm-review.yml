name: LLM Review & Notify

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer jq pour traiter le diff proprement
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3️⃣ Générer le diff de la PR et l’échapper pour le JSON
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > pr.diff
          DIFF=$(cat pr.diff | jq -Rs .)
          echo "llm_diff=$DIFF" >> $GITHUB_OUTPUT

      # 4️⃣ Appeler l’API Gemini LLM
      - name: Call Gemini LLM
        id: llm
        run: |
          RESPONSE=$(jq -n \
            --arg prompt "Tu es un relecteur de code expert. Analyse ce diff. Si le code est bon, fournis des pistes d'amélioration. Si le code contient des bugs, liste-les. Réponds en français." \
            --arg diff "${{ steps.diff.outputs.llm_diff }}" \
            '{contents: [{parts: [{text: "\($prompt)\n\nDiff:\n\($diff)"}]}]}' \
            | curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
              -H "Content-Type: application/json" \
              -d @-)

          if [ -z "$RESPONSE" ]; then
            RESPONSE="⚠️ Erreur : L'API Gemini n'a pas renvoyé de réponse. Vérifie la clé API ou l'URL."
          fi

          echo "llm_response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5️⃣ Commenter automatiquement la PR sur GitHub
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const response = `${{ steps.llm.outputs.llm_response }}`;
            const comment = response && response.trim() !== ""
              ? `### 🤖 Revue automatique par l'IA\n\n${response}`
              : "⚠️ Une erreur est survenue lors de l'analyse par l'IA.";
            await github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      # 6️⃣ Envoi d’un mail à l’équipe
      - name: Send Email to Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔍 Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          body: |
            Voici la revue générée par l'IA :

            ${{ steps.llm.outputs.llm_response }}
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          secure: true
