name: LLM Review & Notify

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

permissions:
  contents: read         # nécessaire pour git diff
  pull-requests: write   # pour commenter la PR
  issues: write          # pour commenter (si nécessaire)
  actions: read

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout du code
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # nécessaire pour git diff complet

      # 2️⃣ Installer jq pour manipuler JSON
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3️⃣ Générer le diff de la PR
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > pr.diff
          DIFF=$(jq -Rs . pr.diff)
          echo "llm_diff=$DIFF" >> $GITHUB_OUTPUT

      # 4️⃣ Appeler l’API Gemini 2.5 Flash
      - name: Call Gemini LLM
        id: gemini
        run: |
          PROMPT="Tu es un relecteur de code expert. Analyse ce diff. Si le code est bon, propose des pistes d'amélioration. Si le code contient des bugs, liste-les clairement. Réponds en français."
          DIFF=${{ steps.diff.outputs.llm_diff }}

          # Construction du payload JSON avec heredoc
          cat <<EOF > payload.json
{
  "contents": [
    {
      "parts": [
        {
          "text": "${PROMPT}\n\nDiff:\n${DIFF}"
        }
      ]
    }
  ]
}
EOF

          echo "📦 Payload envoyé à Gemini :"
          cat payload.json

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          if [ -z "$RESPONSE" ]; then
            RESPONSE="⚠️ Erreur : L'API Gemini n'a pas renvoyé de réponse. Vérifie la clé API ou l'URL."
          fi

          echo "llm_response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5️⃣ Commenter la PR (compatible forks)
      - name: Comment on PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = `${{ steps.gemini.outputs.llm_response }}`;
            let text = raw;
            try {
              const json = JSON.parse(raw);
              if (json.candidates && json.candidates[0].content && json.candidates[0].content.parts) {
                text = json.candidates[0].content.parts.map(p => p.text).join("\n");
              }
            } catch {}
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 Revue automatique par Gemini 2.5 Flash\n\n${text}`
            })

      # 6️⃣ Envoi d’un mail à l’équipe
      - name: Send Email to Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔍 Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          body: |
            Voici la revue générée automatiquement par Gemini 2.5 Flash :

            ${{ steps.gemini.outputs.llm_response }}
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          secure: true
