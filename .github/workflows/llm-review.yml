name: LLM Review & Notify

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

jobs:
  review_and_notify:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Récupération du code source
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Installer jq pour le formatage JSON
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # 3️⃣ Générer le diff entre la branche base et la PR
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > pr.diff
          DIFF=$(cat pr.diff | jq -Rs .)
          echo "llm_diff=$DIFF" >> $GITHUB_OUTPUT

      # 4️⃣ Appeler l’API Gemini pour analyse du diff
      - name: Call Gemini LLM
        id: llm
        run: |
          PAYLOAD=$(jq -n \
            --arg prompt "Tu es un relecteur de code expert. Analyse ce diff. Si le code est bon, fournis des pistes d'amélioration. Si le code contient des bugs, liste-les. Réponds en français." \
            --arg diff "${{ steps.diff.outputs.llm_diff }}" \
            '{contents: [{parts: [{text: ($prompt + "\n\nDiff:\n" + $diff)}]}]}')

          echo "Payload envoyé à Gemini :"
          echo "$PAYLOAD"

          RESPONSE=$(echo "$PAYLOAD" | curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @-)

          if [ -z "$RESPONSE" ]; then
            RESPONSE="⚠️ Erreur : L'API Gemini n'a pas renvoyé de réponse. Vérifie la clé API ou l'URL."
          fi

          echo "llm_response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 5️⃣ Poster le commentaire sur la Pull Request
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = `${{ steps.llm.outputs.llm_response }}`;
            let text = "⚠️ Erreur lors de la génération de la revue IA.";
            try {
              const json = JSON.parse(raw);
              if (json.candidates && json.candidates[0].content && json.candidates[0].content.parts) {
                text = json.candidates[0].content.parts.map(p => p.text).join("\n");
              } else {
                text = raw;
              }
            } catch {
              text = raw;
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 Revue automatique par Gemini AI\n\n${text}`
            });

      # 6️⃣ Envoi d’un email automatique à l’équipe
      - name: Send Email to Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔍 Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          body: |
            Voici la revue générée automatiquement par Gemini :

            ${{ steps.llm.outputs.llm_response }}
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          secure: true