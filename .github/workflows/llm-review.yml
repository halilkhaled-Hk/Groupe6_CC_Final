name: LLM Review & Notify

on:
  pull_request:
    types: [opened, synchronize]
    branches: [ develop ]

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

     - name: Get PR diff
  id: diff
  run: |
    git fetch origin ${{ github.event.pull_request.base.ref }}
    git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} > pr.diff
    echo "llm_diff<<EOF" >> $GITHUB_OUTPUT
    cat pr.diff >> $GITHUB_OUTPUT
    echo "EOF" >> $GITHUB_OUTPUT


      - name: Call Gemini LLM
        id: llm
        run: |
          RESPONSE=$(curl -s -X POST "https://api.gemini.example.com/analyze" \
            -H "Authorization: Bearer ${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d "{\"prompt\": \"Tu es un relecteur de code expert. Analyse ce diff. Si le code est bon, fournis des pistes d'amélioration. Si le code contient des bugs, liste-les. Réponds en français.\", \"code_diff\": \"${{ steps.diff.outputs.diff }}\"}")
          echo "llm_response=$RESPONSE" >> $GITHUB_OUTPUT

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: ${{ github.event.pull_request.number }},
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `@${{ github.actor }} Voici la revue générée par l'IA :\n\n${{ steps.llm.outputs.llm_response }}`
            })

      - name: Send Email to Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          body: "Voici la revue générée par l'IA : \n\n${{ steps.llm.outputs.llm_response }}"
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          secure: true
