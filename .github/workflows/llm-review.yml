name: LLM Review & Notify
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop

# Permissions nécessaires pour commenter sur les PRs
permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review_and_notify:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Récupération du code
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # 2️⃣ Installer jq pour manipuler JSON
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq
      
      # 3️⃣ Générer le diff de la PR (exclure les fichiers binaires)
      - name: Get PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }}
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.sha }} -- . ":(exclude)*.pyc" > pr.diff
          # Limiter la taille du diff si nécessaire
          if [ $(wc -c < pr.diff) -gt 50000 ]; then
            head -c 50000 pr.diff > pr_truncated.diff
            echo "⚠️ Diff tronqué (trop volumineux)" >> pr_truncated.diff
            mv pr_truncated.diff pr.diff
          fi
      
      # 4️⃣ Appeler Gemini 2.5-flash pour analyse
      - name: Call Gemini LLM
        id: gemini
        shell: bash
        run: |
          PROMPT="Tu es un relecteur de code expert. Analyse ce diff. Si le code est bon, propose des pistes d'amélioration. Si le code contient des bugs, liste-les clairement. Réponds en français."
          
          # Lire le diff et l'échapper correctement pour JSON
          DIFF_CONTENT=$(cat pr.diff)
          
          # Créer le payload JSON avec jq pour éviter les problèmes d'échappement
          jq -n \
            --arg prompt "$PROMPT" \
            --arg diff "$DIFF_CONTENT" \
            '{
              contents: [
                {
                  parts: [
                    {
                      text: ($prompt + "\n\nDiff:\n" + $diff)
                    }
                  ]
                }
              ]
            }' > payload.json
          
          echo "📦 Payload créé (taille: $(wc -c < payload.json) octets)"
          
          # Appel API
          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash-exp:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)
          
          if [ -z "$RESPONSE" ]; then
            RESPONSE='{"error": "L'\''API Gemini n'\''a pas renvoyé de réponse. Vérifie la clé API ou l'\''URL."}'
          fi
          
          # Sauvegarder la réponse dans un fichier pour éviter les problèmes de multiline
          echo "$RESPONSE" > response.json
          
          # Utiliser un délimiteur EOF pour les sorties multilignes
          {
            echo "llm_response<<EOF"
            cat response.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      
      # 5️⃣ Sauvegarder la réponse dans une variable d'environnement
      - name: Save LLM Response
        run: |
          cat response.json > llm_response.txt
          echo "Response saved to file"
      
      # 6️⃣ Commenter automatiquement la PR
      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          LLM_RESPONSE: ${{ steps.gemini.outputs.llm_response }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const raw = process.env.LLM_RESPONSE;
            let text = "⚠️ Erreur lors de la génération de la revue IA.";
            
            try {
              const json = JSON.parse(raw);
              
              if (json.error) {
                text = `⚠️ ${json.error}`;
              } else if (json.candidates && json.candidates[0]?.content?.parts) {
                text = json.candidates[0].content.parts.map(p => p.text).join("\n");
              } else if (json.candidates && json.candidates[0]?.text) {
                text = json.candidates[0].text;
              } else {
                text = "Réponse de l'API:\n```json\n" + JSON.stringify(json, null, 2) + "\n```";
              }
            } catch (e) {
              text = `⚠️ Erreur de parsing JSON: ${e.message}\n\nRéponse brute:\n\`\`\`\n${raw.substring(0, 500)}\n\`\`\``;
            }
            
            // Limiter la taille du commentaire
            if (text.length > 65000) {
              text = text.substring(0, 65000) + "\n\n... (tronqué)";
            }
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 Revue automatique par Gemini AI\n\n${text}`
            });
      
      # 7️⃣ Envoi d'un email à l'équipe
      - name: Send Email to Team
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "🔍 Revue LLM pour PR #${{ github.event.pull_request.number }} par @${{ github.actor }}"
          body: |
            Bonjour,
            
            Une nouvelle Pull Request a été soumise et analysée par Gemini AI.
            
            PR: ${{ github.event.pull_request.html_url }}
            Auteur: @${{ github.actor }}
            
            Consultez les commentaires sur la PR pour voir la revue complète.
            
            ---
            Ceci est un email automatique.
          to: ${{ secrets.TEAM_EMAIL_LIST }}
          from: GitHub Actions
          secure: true
