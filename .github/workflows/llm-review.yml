name: CI Pipeline

on:
  pull_request:
    branches:
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install flake8 black mypy

      - name: Vérifications de qualité
        run: |
          flake8 .
          black --check .
          mypy .

      - name: Analyse du code avec Gemini
        id: gemini
        shell: bash
        run: |
          PROMPT="Tu es un relecteur de code expert. Analyse ce diff. Si le code est bon, propose des pistes d'amélioration. Si le code contient des bugs, liste-les clairement. Réponds en français."
          DIFF=$(git diff HEAD~1 HEAD)

          # Créer le payload JSON (attention : EOF non indenté)
          cat > payload.json <<'EOF'
{
  "contents": [
    {
      "parts": [
        {
          "text": "PLACEHOLDER"
        }
      ]
    }
  ]
}
EOF

          # Remplacer le texte par le vrai contenu
          sed -i "s|PLACEHOLDER|${PROMPT}\n\nDiff:\n${DIFF}|" payload.json

          echo "📦 Payload envoyé à Gemini :"
          cat payload.json

          RESPONSE=$(curl -s -X POST \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${{ secrets.GEMINI_API_KEY }}" \
            -H "Content-Type: application/json" \
            -d @payload.json)

          echo "llm_response<<EOF" >> $GITHUB_OUTPUT
          echo "$RESPONSE" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Afficher la réponse de Gemini
        run: |
          echo "🧠 Réponse de Gemini :"
          echo "${{ steps.gemini.outputs.llm_response }}"
